name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Scan the sample app (manifest + plist)
        run: |
          PYTHONPATH=src python -m mobile_appsec scan sample-vulnerable-app/android/AndroidManifest.xml
          PYTHONPATH=src python -m mobile_appsec scan sample-vulnerable-app/ios/Info.plist
